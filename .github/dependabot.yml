version: 2

updates:
  # The npm ecosystem also covers pnpm and reads pnpm-lock.yaml. Minor and patch land as one
  # grouped PR per week so routine bumps do not become a dozen separate reviews; majors stay
  # individual because they need one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Matches minimumReleaseAge in pnpm-workspace.yaml, so a routine bump never proposes a version
    # the install would reject as too new.
    cooldown:
      default-days: 3
    groups:
      # @eslint-react releases near-daily, and the flat config hand-maintains a
      # list of its rules switched off in favour of eslint-plugin-react-hooks.
      # A newly added rule that overlaps that list arrives as warning drift,
      # which is invisible inside a ten-package PR, so this one moves on its own
      # at every update type. It is declared first because the catch-all group
      # below would otherwise claim its minor and patch bumps.
      eslint-react:
        patterns:
          - "@eslint-react/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The one major that cannot land alone. vitest and @vitest/coverage-v8
      # peer-depend on each other by exact version, so two separate major PRs
      # each pair the new major with the other still on the old one, an unmet
      # peer in both. Minor and patch ride the group above.
      vitest-major:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major

  # Actions are pinned to commit SHAs, which pins the supply chain but also means
  # nothing updates them by hand. This is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze are two actions out of one repo, and the action aborts
      # with a configuration error when a workflow runs two versions of itself.
      # Split PRs are two red runs, so every part moves as one.
      codeql-action:
        patterns:
          - github/codeql-action*
