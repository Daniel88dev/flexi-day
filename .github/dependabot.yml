version: 2

updates:
  # npm. Minor and patch land as one grouped PR per week so routine bumps do not
  # become a dozen separate reviews; majors stay individual because they need one.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      # The one major that cannot land alone. vitest and @vitest/coverage-v8
      # peer-depend on each other by exact version, so two separate major PRs
      # are two ERESOLVE failures — each one the new major arguing with the
      # other still on the old one. Minor and patch ride the group above.
      vitest-major:
        patterns:
          - vitest
          - "@vitest/*"
        update-types:
          - major

  # Actions are pinned to commit SHAs, which pins the supply chain but also means
  # nothing updates them by hand. This is what keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # init and analyze are two actions out of one repo, and the action aborts
      # with a configuration error when a workflow runs two versions of itself.
      # Split PRs are two red runs, so every part moves as one.
      codeql-action:
        patterns:
          - github/codeql-action*
