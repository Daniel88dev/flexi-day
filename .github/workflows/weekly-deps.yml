name: weekly-deps

# Runs the weekly dependency job from flexi-day-workspace (Fenro T-563). The secrets live in this
# repo's `weekly-deps` environment and still have to be passed by name.
on:
  schedule:
    - cron: "0 6 * * 3"
  workflow_dispatch:

permissions: {}

jobs:
  weekly-deps:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: read
      checks: read
    uses: Daniel88dev/flexi-day-workspace/.github/workflows/weekly-deps.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      FENRO_TOKEN: ${{ secrets.FENRO_TOKEN }}
